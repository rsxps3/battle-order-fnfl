# Battle Order : @DOMAIN@
# Cette configuration ne gère que le HTTP : « certbot --nginx -d @DOMAIN@ » ajoute le HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    root @WEBROOT@;
    index index.html;
    server_tokens off;

    # l'éditeur, la charte graphique et la page de confidentialité (listes JSON relues à chaque visite)
    location / {
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # fichiers cachés (.git, .env...) : jamais servis
    location ~ /\. { return 404; }

    # pages publiées : lecture seule, jamais indexées, aucun script autorisé (seules les feuilles de style, polices et images du site sont permises)
    location = /o/ { return 404; }
    location ^~ /o/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        autoindex off;
        try_files $uri $uri/index.html =404;
    }

    # service de publication (local) : la publication est limitée en débit
    location = /api/publish {
        limit_req zone=bo_publish burst=5 nodelay;
        client_max_body_size 300k;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location /api/ {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
}
